name: Verify HanJul

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install application and browser test dependencies
        run: |
          python -m pip install -r requirements.lock.txt -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Run isolated API and browser tests
        run: |
          export HANJUL_TEST_CHROME=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          python -m pytest -q
      - name: Validate all deployment configurations
        env:
          MEMO_PUBLIC_ORIGIN: https://notes.example.test
          HANJUL_DOMAIN: notes.example.test
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.nas.yaml config --quiet
          docker compose -f compose.yaml -f compose.https.yaml config --quiet
          docker compose -f compose.yaml -f deploy/compose.restore.yaml config --quiet
      - name: Smoke test container persistence, backup and recovery
        run: sh scripts/verify-compose.sh
      - name: Check source-only release
        run: python scripts/package_release.py
